name: Plan A software loops

on:
  push:
    branches: [main]
  pull_request:

jobs:
  track1-track4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-rvp1-lock.txt
      - run: python -m pip install -e .
      - run: python -m repository_gate
      - run: python -m pytest -q
      - run: python demo_plan_a_tracks.py
