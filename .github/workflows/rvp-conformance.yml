name: RVP-1 conformance
on:
  push:
    branches: [main]
  pull_request:
jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest plan_a_protocol/tests embedded_audit/tests verification_lab/tests frame_processor/tests hostile_prover/tests formal/test_reference_model.py benchmarks/test_benchmark.py benchmarks/test_scorecard.py compute_accounting/test_interval_ledger.py gateway/test_policy.py provenance/test_gate.py assurance/test_compose.py crypto/test_proof_envelope.py hardware/test_live_capture_import.py deployment/test_readiness.py telemetry/test_consistency.py -q
      - run: python -m benchmarks.benchmark
      - run: python -m hostile_prover.run_benchmark
      - run: python -m verification_lab.run_report
      - run: python -m replication.collect_manifest
      - uses: actions/upload-artifact@v4
        with:
          name: rvp-1-reproducibility-bundle
          path: |
            benchmark_result.json
            adversarial_results.json
            retrofit_readiness_report.json
            replication_manifest.json
          if-no-files-found: error
