[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "ai2040-rvp1"
version = "0.1.0"
description = "Reproducible verification research package for AI 2040 Plan A"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = [
  "plan_a_protocol*","embedded_audit*","verification_lab*","frame_processor*",
  "hostile_prover*","formal*","benchmarks*","compute_accounting*","gateway*",
  "provenance*","assurance*","crypto*","hardware*","deployment*","telemetry*",
  "storage*","redteam*","track3*","company_audit*","physical*",
  "workload_policy*","governance*","workload_execution*","channel_budget*",
  "model_registry*","evidence_graph*","input_warden*","compute_meter*","challenge_scheduler*","supply_chain*"
]
